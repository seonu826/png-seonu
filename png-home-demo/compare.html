<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首页对比 · 实际首页 vs 仿制页</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #1d2b44; height: 100vh; display: flex; flex-direction: column; }
    .bar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; color: #fff; font-size: 13px; flex-wrap: wrap; }
    .bar input { width: 260px; padding: 6px 8px; border-radius: 6px; border: 0; font-size: 13px; }
    .bar button { padding: 6px 14px; border: 0; border-radius: 6px; background: #2f7cf6; color: #fff; cursor: pointer; }
    .bar label { display: flex; gap: 6px; align-items: center; }
    .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 6px 6px; min-height: 0; }
    .pane { display: flex; flex-direction: column; background: #fff; border-radius: 8px; overflow: hidden; min-height: 0; }
    .pane h4 { margin: 0; padding: 8px 12px; font-size: 13px; background: #eef3fa; color: #1d2b44; }
    .pane .frame { flex: 1; position: relative; overflow: hidden; }
    .pane iframe { position: absolute; top: 0; left: 0; border: 0; width: 1440px; transform-origin: 0 0; }
  </style>
</head>
<body>
  <div class="bar">
    <label>实际首页 <input id="left" value="http://localhost:8080/" /></label>
    <label>仿制页 <input id="right" value="http://localhost:5180/" /></label>
    <button id="go">打开 / 열기</button>
    <span>※ 실제 첫 화면은 PC 프로젝트(png-web-pc)를 실행한 주소를 넣으세요 (8080 또는 8081)</span>
  </div>
  <div class="panes">
    <div class="pane"><h4>실제 첫 화면 · 实际首页</h4><div class="frame"><iframe id="fl"></iframe></div></div>
    <div class="pane"><h4>새로 만든 페이지 · 仿制页（Thumbor）</h4><div class="frame"><iframe id="fr"></iframe></div></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id)
    function fit () {
      document.querySelectorAll('.frame').forEach((box) => {
        const f = box.querySelector('iframe'); const s = box.clientWidth / 1440
        f.style.transform = `scale(${s})`; f.style.height = (box.clientHeight / s) + 'px'
      })
    }
    function open () { $('fl').src = $('left').value; $('fr').src = $('right').value; fit() }
    $('go').onclick = open; window.onresize = fit; open()
  </script>
</body>
</html>
